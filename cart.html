<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Shopping Cart | Puffora Naturals</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="header"></div>

    <section class="cart-page">
        <div class="cart-card">
            <div class="cart-header">
                <div>
                    <h2 style="margin-bottom:4px;">Shopping Cart</h2>
                    <p style="margin:0; color:#666;">Review your selected products before checkout.</p>
                </div>
                <button class="cart-action-btn secondary" id="clear-cart-btn" type="button">Clear Cart</button>
            </div>

            <div class="cart-content">
                <div id="cart-items"></div>
                <div class="cart-summary">
                    <h5 style="margin-bottom:16px;">Order Summary</h5>
                    <div class="summary-row"><span>Subtotal</span><strong data-cart-subtotal>₹0</strong></div>
                    <div class="summary-row"><span>Shipping</span><strong data-cart-shipping>₹0</strong></div>
                    <div class="summary-row total"><span>Grand Total</span><strong data-cart-grand-total>₹0</strong></div>
                    <div class="checkout-actions" style="margin-top:20px;">
                        <a href="checkout.html" class="buy-now" id="checkout-link" style="display:none;">Proceed to Checkout</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div id="footer"></div>

    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/include.js"></script>
    <script src="js/main.js"></script>
    <script>
        (function () {
            const storageKey = 'puffora-cart';
            const itemsContainer = document.getElementById('cart-items');
            const clearCartButton = document.getElementById('clear-cart-btn');
            const checkoutLink = document.getElementById('checkout-link');

            function getCart() {
                try {
                    const storedValue = sessionStorage.getItem(storageKey);
                    return storedValue ? JSON.parse(storedValue) : { items: [] };
                } catch (error) {
                    return { items: [] };
                }
            }

            function saveCart(cart) {
                sessionStorage.setItem(storageKey, JSON.stringify(cart));
            }

            function refreshCartPage() {
                renderCart();
                if (window.PufforaCart) {
                    window.PufforaCart.updateBadge();
                    window.PufforaCart.updateCartView();
                }
            }

            function renderCart() {
                const cart = getCart();
                const items = cart.items || [];
                const subtotal = items.reduce((total, item) => total + ((Number(item.productPrice) || 0) * (Number(item.quantity) || 0)), 0);
                const shipping = subtotal > 0 ? 99 : 0;
                const grandTotal = subtotal + shipping;

                if (!items.length) {
                    itemsContainer.innerHTML = '<div class="cart-empty"><h4>Your cart is empty</h4><p>Add products from the catalog to begin.</p><a href="index.html" class="cart-action-btn buy">Continue Shopping</a></div>';
                    checkoutLink.style.display = 'none';
                    clearCartButton.style.display = 'none';
                    document.querySelectorAll('[data-cart-subtotal]').forEach((el) => el.textContent = '₹0');
                    document.querySelectorAll('[data-cart-shipping]').forEach((el) => el.textContent = '₹0');
                    document.querySelectorAll('[data-cart-grand-total]').forEach((el) => el.textContent = '₹0');
                    if (window.PufforaCart) {
                        window.PufforaCart.updateBadge();
                        window.PufforaCart.updateCartView();
                    }
                    return;
                }

                clearCartButton.style.display = 'inline-flex';
                checkoutLink.style.display = 'inline-flex';
                itemsContainer.innerHTML = items.map((item) => {
                    const itemTotal = (Number(item.productPrice) || 0) * (Number(item.quantity) || 0);
                    const imageMarkup = item.productImage
                        ? '<img src="' + item.productImage + '" alt="' + item.productName + '">'
                        : '<i class="fas fa-box"></i>';
                    const variantSizeText = item.variantSize ? ' (' + item.variantSize + 'g)' : '';
                    const cartItemKey = item.productId + (item.variantId ? '-' + item.variantId : '');
                    return '<div class="cart-item">' +
                        '<div class="cart-item-image">' + imageMarkup + '</div>' +
                        '<div class="cart-item-body">' +
                        '<div class="cart-item-meta">' +
                        '<div><div class="cart-item-title">' + (item.productName || 'Product') + variantSizeText + '</div><div class="cart-item-price">₹' + (Number(item.productPrice) || 0).toLocaleString('en-IN') + '</div></div>' +
                        '<div><strong>₹' + itemTotal.toLocaleString('en-IN') + '</strong></div>' +
                        '</div>' +
                        '<div class="cart-qty-controls">' +
                        '<button type="button" data-action="decrease" data-product-id="' + cartItemKey + '">−</button>' +
                        '<span>' + (item.quantity || 1) + '</span>' +
                        '<button type="button" data-action="increase" data-product-id="' + cartItemKey + '">+</button>' +
                        '<button type="button" class="cart-remove-btn" data-action="remove" data-product-id="' + cartItemKey + '">Remove</button>' +
                        '</div>' +
                        '</div>' +
                        '</div>';
                }).join('');

                document.querySelectorAll('[data-cart-subtotal]').forEach((el) => el.textContent = '₹' + subtotal.toLocaleString('en-IN'));
                document.querySelectorAll('[data-cart-shipping]').forEach((el) => el.textContent = '₹' + shipping.toLocaleString('en-IN'));
                document.querySelectorAll('[data-cart-grand-total]').forEach((el) => el.textContent = '₹' + grandTotal.toLocaleString('en-IN'));
                if (window.PufforaCart) {
                    window.PufforaCart.updateBadge();
                    window.PufforaCart.updateCartView();
                }
            }

            function updateItem(productKey, action) {
                const cart = getCart();
                const itemIndex = cart.items.findIndex((item) => {
                    const itemKey = item.productId + (item.variantId ? '-' + item.variantId : '');
                    return itemKey === productKey;
                });
                
                if (itemIndex === -1) {
                    return;
                }
                
                const item = cart.items[itemIndex];

                if (action === 'increase') {
                    item.quantity += 1;
                } else if (action === 'decrease') {
                    item.quantity = Math.max(1, item.quantity - 1);
                } else if (action === 'remove') {
                    cart.items.splice(itemIndex, 1);
                }

                saveCart(cart);
                refreshCartPage();
            }

            itemsContainer.addEventListener('click', function (event) {
                const button = event.target.closest('button[data-action]');
                if (!button) {
                    return;
                }
                const action = button.getAttribute('data-action');
                const productId = button.getAttribute('data-product-id');
                if (!productId) {
                    return;
                }
                updateItem(productId, action);
            });

            clearCartButton.addEventListener('click', function () {
                saveCart({ items: [] });
                refreshCartPage();
            });

            renderCart();
        })();
    </script>
</body>
</html>
